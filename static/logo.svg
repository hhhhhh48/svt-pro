<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- توهج خارجي -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>

  <!-- الدائرة الرئيسية -->
  <circle cx="100" cy="100" r="88" fill="#050510" stroke="url(#grad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>

  <!-- قوس أخضر (العلم الجزائري) -->
  <path d="M 22,80 Q 100,60 178,80" fill="none" stroke="#006233" stroke-width="4" stroke-linecap="round"/>

  <!-- الهلال والنجمة (رمز الجزائر) -->
  <g transform="translate(100, 58)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="#d21034" stroke-width="3"/>
    <circle cx="4" cy="0" r="9" fill="#050510"/>
    <polygon points="-2,-9 0,-4 5,-4 1,-1 3,4 -2,1 -7,4 -5,-1 -9,-4 -4,-4" fill="#d21034" transform="translate(4,0) scale(0.85)"/>
  </g>

  <!-- كلمة BAC -->
  <text x="100" y="128" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#grad2)" text-anchor="middle" letter-spacing="2">BAC</text>

  <!-- 2026 -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="6">2026</text>

  <!-- الطفل يقرأ الكتاب (يسار) -->
  <g transform="translate(48, 168)">
    <circle cx="0" cy="-6" r="6" fill="url(#grad)"/>
    <path d="M -7,0 L -9,14 L 9,14 L 7,0 Z" fill="url(#grad)" opacity="0.9"/>
    <path d="M -14,4 L -9,1 L -9,10 L -14,13 Z" fill="#ffffff"/>
    <path d="M 9,1 L 14,4 L 14,13 L 9,10 Z" fill="#ffffff"/>
    <line x1="0" y1="1" x2="0" y2="10" stroke="#050510" stroke-width="1"/>
  </g>

  <!-- العالم يمسك بأنبوب اختبار (يمين) -->
  <g transform="translate(152, 168)">
    <circle cx="0" cy="-6" r="6" fill="url(#grad)"/>
    <path d="M -7,0 L -9,14 L 9,14 L 7,0 Z" fill="url(#grad)" opacity="0.9"/>
    <path d="M 9,4 L 13,4 L 15,12 L 11,12 Z" fill="#ffffff"/>
    <circle cx="12.5" cy="9" r="1.5" fill="#00d4ff"/>
  </g>

  <!-- قوس أحمر أسفل (العلم الجزائري) -->
  <path d="M 30,185 Q 100,193 170,185" fill="none" stroke="#d21034" stroke-width="3" stroke-linecap="round"/>
</svg>
